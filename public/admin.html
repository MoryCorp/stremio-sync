<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin - Stremio Config Manager</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="page-dashboard">
  <div class="page-header">
    <h1>Stremio Config Manager</h1>
    <span class="tag">Admin</span>
  </div>

  <!-- Auth -->
  <div class="section">
    <div class="auth-bar">
      <input class="form-input" type="password" id="adminToken"
             placeholder="Admin token" aria-label="Admin token">
      <button class="btn btn-primary" id="saveTokenBtn">
        <span class="btn-text">Connect</span>
        <span class="spinner"></span>
      </button>
      <span class="auth-status" id="authStatus"></span>
    </div>
  </div>

  <!-- Users -->
  <div class="section">
    <div class="section-header">
      <h2>Users</h2>
      <span class="text-muted text-sm" id="userCount"></span>
    </div>
    <div id="usersContent"></div>
    <div id="userAddonsPanel" class="panel hidden">
      <div class="panel-header">
        <h3 id="userAddonsTitle"></h3>
        <button class="btn btn-sm btn-secondary" id="closeAddonsBtn">Close</button>
      </div>
      <div id="userAddonsList"></div>
    </div>
  </div>

  <!-- Master Config -->
  <div class="section">
    <div class="section-header">
      <h2>Master Config</h2>
      <span class="text-muted text-sm" id="configCount"></span>
    </div>
    <div id="configContent"></div>
    <div class="form-row mt-1">
      <input class="form-input" type="email" id="importEmail" placeholder="Stremio email">
      <input class="form-input" type="password" id="importPassword" placeholder="Stremio password">
      <button class="btn btn-secondary" id="importConfigBtn">
        <span class="btn-text">Import from account</span>
        <span class="spinner"></span>
      </button>
    </div>
  </div>

  <!-- Deploy -->
  <div class="section">
    <div class="section-header">
      <h2>Deploy</h2>
    </div>
    <div class="btn-group">
      <button class="btn btn-secondary" id="previewBtn">
        <span class="btn-text">Preview changes</span>
        <span class="spinner"></span>
      </button>
      <button class="btn btn-primary" id="deployBtn">
        <span class="btn-text">Deploy to all</span>
        <span class="spinner"></span>
      </button>
    </div>
    <div id="previewContent" class="mt-1"></div>
    <div id="deployResult" class="mt-1"></div>
  </div>

  <!-- Logs -->
  <div class="section">
    <div class="section-header">
      <h2>Recent Logs</h2>
    </div>
    <div id="logsContent"></div>
  </div>

  <!-- Modal (reused) -->
  <div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <h3 class="modal-title" id="modalTitle"></h3>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modalCancelBtn">Cancel</button>
        <button class="btn btn-primary" id="modalConfirmBtn">Confirm</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  <script type="module" src="../js/admin.js"></script>
</body>
</html>
