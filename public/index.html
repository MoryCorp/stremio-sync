<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Stremio Config Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-center">
  <div class="container-sm">
    <h1>Stremio Config Manager</h1>
    <p class="subtitle">Connect your Stremio account to receive addon updates automatically.</p>

    <form id="enrollForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Stremio Email</label>
        <input class="form-input" type="email" id="email" name="email"
               required autocomplete="email" placeholder="you@example.com">
        <span class="form-error"></span>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Stremio Password</label>
        <input class="form-input" type="password" id="password" name="password"
               required autocomplete="current-password">
        <span class="form-error"></span>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="submitBtn">
        <span class="btn-text">Connect my account</span>
        <span class="spinner"></span>
      </button>
    </form>

    <p class="info">
      Your credentials are sent directly to the official Stremio API and stored encrypted.
      They are only used to keep your addon configuration in sync.
    </p>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  <script type="module" src="js/enroll.js"></script>
</body>
</html>
